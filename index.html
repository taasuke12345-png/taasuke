<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>気仙沼の風景 📸</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1b2a3a;
    --paper: #f6f4ef;
    --accent: #c8451f;
    --wave: #2e6f8e;
    --card-bg: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100svh;
  }

  header {
    background: var(--wave);
    color: #fff;
    text-align: center;
    padding: 1.2rem 1rem;
  }
  header h1 { font-size: clamp(1.2rem, 4vw, 1.8rem); letter-spacing: 0.1em; }
  header p { font-size: 0.85rem; opacity: 0.85; margin-top: 0.3rem; }

  .container { max-width: 700px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }

  .post-form {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 1.2rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
  }
  .post-form h2 {
    font-size: 1rem;
    margin-bottom: 1rem;
    color: var(--wave);
    border-left: 4px solid var(--accent);
    padding-left: 0.6rem;
  }
  .form-row { margin-bottom: 0.8rem; }
  .form-row label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem; color: #445; }
  .form-row input[type="text"],
  .form-row textarea,
  .form-row select {
    width: 100%;
    border: 1.5px solid #d0d0d0;
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: #fafafa;
    transition: border-color 0.2s;
  }
  .form-row input[type="text"]:focus,
  .form-row textarea:focus,
  .form-row select:focus { outline: none; border-color: var(--wave); background: #fff; }
  .form-row textarea { resize: vertical; min-height: 80px; }

  .photo-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    background: #f0f7fb;
    border: 2px dashed var(--wave);
    border-radius: 8px;
    padding: 0.8rem 1rem;
    font-size: 0.9rem;
    color: var(--wave);
    font-weight: 700;
    transition: background 0.2s;
  }
  .photo-label:hover { background: #e0f0f8; }
  .photo-label input { display: none; }

  #preview-wrap { margin-top: 0.6rem; display: none; }
  #preview-wrap img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; }

  .btn-post {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
    margin-top: 0.4rem;
  }
  .btn-post:hover { background: #a83518; }
  .btn-post:disabled { background: #aaa; cursor: not-allowed; }

  .posts-header { font-size: 0.95rem; font-weight: 700; color: #445; margin-bottom: 0.8rem; }

  .no-posts { text-align: center; color: #888; padding: 2rem; font-size: 0.9rem; }

  .loading { text-align: center; color: #888; padding: 2rem; font-size: 0.9rem; }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .card img { width: 100%; max-height: 280px; object-fit: cover; display: block; }
  .card-body { padding: 0.9rem 1rem; }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    gap: 0.3rem;
  }
  .card-name { font-weight: 700; font-size: 0.9rem; color: var(--wave); }
  .card-location {
    font-size: 0.8rem;
    background: #f0f7fb;
    color: var(--wave);
    border-radius: 20px;
    padding: 0.15rem 0.7rem;
  }
  .card-date { font-size: 0.78rem; color: #888; width: 100%; }
  .card-comment { font-size: 0.92rem; line-height: 1.7; color: var(--ink); margin-top: 0.4rem; }
  .btn-delete {
    margin-top: 0.7rem;
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 0.3rem 0.8rem;
    font-size: 0.8rem;
    color: #999;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-delete:hover { border-color: var(--accent); color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: #fff;
    padding: 0.7rem 1.4rem;
    border-radius: 30px;
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>📸 気仙沼の風景</h1>
  <p>あなたが見つけた気仙沼の素敵な景色を投稿してください</p>
</header>

<div class="container">

  <div class="post-form">
    <h2>写真を投稿する</h2>

    <div class="form-row">
      <label>お名前（ニックネームでもOK）</label>
      <input type="text" id="inp-name" placeholder="例：気仙沼太郎" maxlength="20">
    </div>

    <div class="form-row">
      <label>場所</label>
      <select id="inp-location">
        <option value="">場所を選んでください</option>
        <option>大島</option>
        <option>鹿折</option>
        <option>南町・魚町</option>
        <option>内湾</option>
        <option>田中前</option>
        <option>唐桑</option>
        <option>本吉</option>
        <option>階上</option>
        <option>岩井崎</option>
        <option>気仙沼湾</option>
        <option>その他</option>
      </select>
    </div>

    <div class="form-row">
      <label>写真（任意）</label>
      <label class="photo-label">
        <span>📷</span>
        <span id="photo-label-text">写真を選ぶ</span>
        <input type="file" id="inp-photo" accept="image/*">
      </label>
      <div id="preview-wrap">
        <img id="preview-img" src="" alt="プレビュー">
      </div>
    </div>

    <div class="form-row">
      <label>コメント</label>
      <textarea id="inp-comment" placeholder="写真の説明や感想を書いてください" maxlength="200"></textarea>
    </div>

    <button class="btn-post" id="btn-post">投稿する</button>
  </div>

  <div class="posts-header" id="posts-header">投稿一覧</div>
  <div id="posts-list"><div class="loading">読み込み中...</div></div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://xcjidoulfzrwxrepjhcf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9wQPSjSQzP6Ed8k4r8gV2Q_EwMStwtG';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function renderPosts() {
    const list = document.getElementById('posts-list');
    list.innerHTML = '<div class="loading">読み込み中...</div>';

    const { data, error } = await db
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      list.innerHTML = '<div class="no-posts">読み込みに失敗しました。ページを更新してください。</div>';
      return;
    }

    document.getElementById('posts-header').textContent = `投稿一覧（${data.length}件）`;

    if (data.length === 0) {
      list.innerHTML = '<div class="no-posts">まだ投稿がありません。最初の一枚を投稿してみましょう！</div>';
      return;
    }

    list.innerHTML = data.map(p => `
      <div class="card">
        ${p.photo_url ? `<img src="${p.photo_url}" alt="投稿画像">` : ''}
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">👤 ${escapeHtml(p.name || '匿名')}</span>
            ${p.location ? `<span class="card-location">📍 ${escapeHtml(p.location)}</span>` : ''}
            <span class="card-date">${formatDate(p.created_at)}</span>
          </div>
          ${p.comment ? `<div class="card-comment">${escapeHtml(p.comment)}</div>` : ''}
          <button class="btn-delete" onclick="deletePost(${p.id})">削除</button>
        </div>
      </div>
    `).join('');
  }

  async function deletePost(id) {
    if (!confirm('この投稿を削除しますか？')) return;
    const { error } = await db.from('posts').delete().eq('id', id);
    if (error) { showToast('削除できませんでした'); return; }
    showToast('削除しました');
    renderPosts();
  }

  let photoData = null;

  document.getElementById('inp-photo').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        photoData = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('preview-img').src = photoData;
        document.getElementById('preview-wrap').style.display = 'block';
        document.getElementById('photo-label-text').textContent = file.name;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btn-post').addEventListener('click', async function() {
    const name = document.getElementById('inp-name').value.trim();
    const location = document.getElementById('inp-location').value;
    const comment = document.getElementById('inp-comment').value.trim();

    if (!name) { showToast('お名前を入力してください'); return; }
    if (!location) { showToast('場所を選んでください'); return; }
    if (!photoData && !comment) { showToast('写真またはコメントを入力してください'); return; }

    const btn = document.getElementById('btn-post');
    btn.disabled = true;
    btn.textContent = '投稿中...';

    const { error } = await db.from('posts').insert([{
      name,
      location,
      comment,
      photo_url: photoData || null
    }]);

    btn.disabled = false;
    btn.textContent = '投稿する';

    if (error) {
      showToast('投稿できませんでした。もう一度お試しください');
      return;
    }

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-location').value = '';
    document.getElementById('inp-comment').value = '';
    document.getElementById('inp-photo').value = '';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('photo-label-text').textContent = '写真を選ぶ';
    photoData = null;

    showToast('投稿しました！');
    renderPosts();
  });

  renderPosts();
</script>
</body>
</html>
